<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manage Doctors | Medique</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/styles.css"></head>
<body class="bg-light"><div class="container py-4">
<div class="d-flex justify-content-between align-items-center mb-4"><h2>Manage Doctors</h2><div><a th:href="@{/admin/add-doctor}" class="btn btn-success">Add Doctor</a> <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary">Dashboard</a></div></div>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-warning" th:text="${error}"></div>
<div class="card"><div class="card-body"><div th:if="${doctors.isEmpty()}">No doctors found.</div>
<div class="table-responsive" th:unless="${doctors.isEmpty()}"><table class="table table-hover"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Specialization</th><th>Phone</th><th>Actions</th></tr></thead>
<tbody><tr th:each="doctor : ${doctors}"><td th:text="${doctor.id}"></td><td th:text="${doctor.name}"></td><td th:text="${doctor.email}"></td><td th:text="${doctor.specialization}"></td><td th:text="${doctor.phone}"></td><td>
<a th:href="@{/admin/doctors/edit/{id}(id=${doctor.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
<form th:action="@{/admin/doctors/delete/{id}(id=${doctor.id})}" method="post" class="d-inline"><button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete or deactivate this doctor?')">Delete</button></form>
</td></tr></tbody></table></div></div></div></div></body></html>
