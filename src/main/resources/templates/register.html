<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | Medique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-light">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="card border-0 shadow-sm rounded-4 w-100" style="max-width: 520px;">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="display-6 mb-2">🏥</div>
                <h1 class="h3 fw-bold">Create patient account</h1>
                <p class="text-muted mb-0">Register to book and manage appointments</p>
            </div>

            <form action="/register" th:object="${user}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert">
                    <p class="mb-1" th:each="err : ${#fields.allErrors()}" th:text="${err}"></p>
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label">Full name</label>
                    <input id="name" type="text" th:field="*{name}" class="form-control"
                           minlength="2" maxlength="100" autocomplete="name" required>
                    <div class="form-text text-danger" th:errors="*{name}"></div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input id="email" type="email" th:field="*{email}" class="form-control"
                           maxlength="150" autocomplete="email" required>
                    <div class="form-text text-danger" th:errors="*{email}"></div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input id="password" type="password" th:field="*{password}" class="form-control"
                           minlength="6" autocomplete="new-password" required>
                    <div class="form-text text-danger" th:errors="*{password}"></div>
                    <div class="form-text">Use at least 6 characters.</div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">Create account</button>
            </form>

            <p class="text-center text-muted mt-4 mb-0">
                Already registered? <a th:href="@{/login}" class="fw-semibold text-decoration-none">Sign in</a>
            </p>
        </div>
    </div>
</main>
</body>
</html>
