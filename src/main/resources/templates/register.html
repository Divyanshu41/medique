<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register | Medique</title></head>
<body><h2>Create patient account</h2>
<div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger"><p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p></div>
<form th:action="@{/register}" th:object="${user}" method="post">
<input type="text" th:field="*{name}" placeholder="Name" minlength="2" maxlength="100" required>
<input type="email" th:field="*{email}" placeholder="Email" maxlength="150" required>
<input type="password" th:field="*{password}" placeholder="Password (minimum 6 characters)" minlength="6" autocomplete="new-password" required>
<button type="submit">Register</button></form><a th:href="@{/login}">Already have an account? Login</a></body></html>
