<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Add Doctor | Medique</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/styles.css"></head>
<body><div class="container py-4"><h2>Add Doctor</h2>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<form method="post" th:action="@{/admin/add-doctor}" class="card card-body">
<div class="mb-3"><label for="name" class="form-label">Name</label><input id="name" name="name" class="form-control" minlength="2" maxlength="100" required></div>
<div class="mb-3"><label for="specialization" class="form-label">Specialization</label><input id="specialization" name="specialization" class="form-control" required></div>
<div class="mb-3"><label for="email" class="form-label">Email</label><input type="email" id="email" name="email" class="form-control" required></div>
<div class="mb-3"><label for="phone" class="form-label">Phone</label><input id="phone" name="phone" class="form-control" pattern="[0-9]{10}" maxlength="10" required></div>
<div class="mb-3"><label for="password" class="form-label">Temporary password (minimum 8 characters)</label><input type="password" id="password" name="password" class="form-control" minlength="8" autocomplete="new-password" required></div>
<button type="submit" class="btn btn-success">Add Doctor</button></form><a href="/admin/dashboard" class="btn btn-secondary mt-3">Back to Dashboard</a></div></body></html>
