<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Appointments | Medique</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container py-5">
<h1 class="h3 mb-4">My Appointments</h1>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<div class="mb-3">
<a th:href="@{/user/doctors}" class="btn btn-outline-primary"><i class="bi bi-calendar-plus"></i> Book New Appointment</a>
<a th:href="@{/dashboard}" class="btn btn-outline-secondary"><i class="bi bi-house"></i> Dashboard</a>
</div>
<div class="card shadow-sm"><div class="card-body"><div class="table-responsive">
<table class="table table-striped align-middle">
<thead><tr><th>Doctor</th><th>Specialization</th><th>Date</th><th>Time</th><th>Status</th><th>Booked On</th><th>Action</th></tr></thead>
<tbody>
<tr th:each="a : ${appointments}">
<td th:text="${a.doctor != null ? a.doctor.name : ''}">Doctor</td>
<td th:text="${a.doctor != null ? a.doctor.address : ''}">Specialization</td>
<td th:text="${a.appointmentDate}">Date</td><td th:text="${a.timeSlot}">Time</td>
<td><span class="badge text-bg-secondary" th:text="${a.status}">PENDING</span></td>
<td th:text="${a.createdAt}">Created</td>
<td>
<form th:if="${a.status == 'PENDING' or a.status == 'CONFIRMED'}" th:action="@{/user/appointments/{id}/cancel(id=${a.id})}" method="post">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Cancel this appointment?')">Cancel</button>
</form>
<span th:if="${a.status == 'CANCELLED' or a.status == 'COMPLETED'}" class="text-muted small">—</span>
</td>
</tr>
<tr th:if="${#lists.isEmpty(appointments)}"><td colspan="7" class="text-center text-muted py-4">No appointments found. <a th:href="@{/user/doctors}">Book your first appointment</a></td></tr>
</tbody></table></div></div></div></div></body></html>
