<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Medique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-light">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="card border-0 shadow-sm rounded-4 w-100" style="max-width: 440px;">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="display-6 mb-2">🏥</div>
                <h1 class="h3 fw-bold">Welcome to Medique</h1>
                <p class="text-muted mb-0">Sign in to manage your appointments</p>
            </div>

            <div th:if="${loginError}" class="alert alert-danger" role="alert" th:text="${loginError}"></div>
            <div th:if="${logoutMessage}" class="alert alert-success" role="status" th:text="${logoutMessage}"></div>
            <div th:if="${registeredMessage}" class="alert alert-success" role="status" th:text="${registeredMessage}"></div>

            <form action="/login" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label for="username" class="form-label">Email address</label>
                    <input id="username" name="username" type="email" class="form-control form-control-lg"
                           placeholder="you@example.com" autocomplete="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input id="password" name="password" type="password" class="form-control form-control-lg"
                           placeholder="Enter your password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">Sign in</button>
            </form>

            <p class="text-center text-muted mt-4 mb-0">
                Don't have an account?
                <a th:href="@{/register}" class="fw-semibold text-decoration-none">Create patient account</a>
            </p>
        </div>
        <div class="card-footer text-center bg-white border-0 pb-4">
            <small class="text-muted">Doctor and admin accounts are created by an administrator.</small>
        </div>
    </div>
</main>
</body>
</html>
