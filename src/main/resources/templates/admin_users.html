<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>User Management | Medique</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/styles.css"></head>
<body class="bg-light"><div class="container-fluid py-4"><div class="d-flex justify-content-between align-items-center mb-4"><h2>User Management</h2><a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary">Dashboard</a></div>
<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
<div class="card"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
<tbody><tr th:each="user : ${users}"><td th:text="${user.id}"></td><td th:text="${user.name}"></td><td th:text="${user.email}"></td><td th:text="${user.phone ?: '-'}"></td><td th:text="${user.role}"></td><td th:text="${user.isActive ? 'Active' : 'Inactive'}"></td><td>
<a th:href="@{/admin/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
<form th:action="@{/admin/users/toggle-status/{id}(id=${user.id})}" method="post" class="d-inline"><button type="submit" class="btn btn-sm btn-outline-warning">Toggle</button></form>
<form th:action="@{/admin/users/delete/{id}(id=${user.id})}" method="post" class="d-inline"><button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Deactivate this user?')">Deactivate</button></form>
</td></tr></tbody></table></div></div></div></body></html>
