spring.application.name=medique
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/new-hsrole_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Use update only for local development. Set DDL_AUTO=validate in production.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

logging.level.root=INFO
logging.level.com.example.medique=INFO
logging.level.org.springframework.security=WARN
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
info.app.name=Medique Hospital Appointment System
info.app.version=1.0.0
