
name: Medique CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test Medique
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Build and Run Tests
        run: ./mvnw -B clean verify
        env:
          DB_URL: jdbc:h2:mem:medique_test;MODE=MySQL;DB_CLOSE_DELAY=-1
          DB_USERNAME: sa
          DB_PASSWORD: ""
          DDL_AUTO: create-drop
          SESSION_COOKIE_SECURE: "false"
          THYMELEAF_CACHE: "false"
